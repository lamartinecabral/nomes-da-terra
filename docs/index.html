  <body>
    <div id="root"></div>
    <script>
      (async () => {
        const url = "./babel-worker.js";
        const scope = "./";
        await navigator.serviceWorker.register(url, { scope });
        await navigator.serviceWorker.ready;

        // hard reloads explicitly disengage the Service Worker controller by browser design.
        // in this case a normal reload gives control back to the Service Worker.
        if (!navigator.serviceWorker.controller) return location.reload();

        const script = document.createElement("script");
        script.type = "module";
        script.src = "./index.tsx";
        document.head.appendChild(script);
      })();
    </script>
